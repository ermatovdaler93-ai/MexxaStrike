# Сборка APK в облаке GitHub. Запуск: вкладка Actions -> Build APK -> Run workflow
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Godot 4.3 требует JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Части Android SDK, нужные экспорту Godot 4.3 (без Gradle)
      - name: Install Android SDK parts
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot and export templates
        run: |
          V=${GODOT_VERSION}-stable
          wget -q https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_export_templates.tpz
          unzip -q Godot_v${V}_linux.x86_64.zip
          sudo mv Godot_v${V}_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v${V}_export_templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Отладочный ключ подписи APK (создаётся заново на каждой сборке)
      - name: Create debug keystore
        run: keytool -genkeypair -keystore $RUNNER_TEMP/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      # Настройки редактора Godot: где лежат JDK, Android SDK и ключ
      - name: Configure Godot editor settings
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$JAVA_HOME" "$ANDROID_HOME" "$RUNNER_TEMP/debug.keystore" > ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres

      # Первый запуск редактора создаёт кеш импорта ресурсов
      - name: Import project
        run: godot --headless --path . --verbose --editor --quit

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android Debug" build/android/mexxa-strike-debug.apk
          ls -la build/android

      - uses: actions/upload-artifact@v4
        with:
          name: MexxaStrike-apk
          path: build/android/*.apk
